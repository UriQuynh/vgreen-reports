<style>
  :root {
    --green: #145a46; --green-light: #1e8e5a; --red: #c0392b;

    --bg: #f4f6f8; --card: #ffffff; --border: #dfe4ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: #1f2937;
  }
  header.top {
    background: linear-gradient(135deg, var(--green), #0d3d30);
    color: white; padding: 18px 20px 22px;
  }
  header.top h1 { margin: 0 0 4px; font-size: 20px; }
  header.top .sub { font-size: 13px; opacity: .85; }
  .nav-links { margin-top: 10px; font-size: 13px; }
  .nav-links a { color: #d7ffe9; margin-right: 14px; text-decoration: underline; }
  .container { max-width: 1180px; margin: -14px auto 40px; padding: 0 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab-btn {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px 10px 0 0;
    padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; color: #374151;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
  }
  .tab-btn.active { background: var(--green); color: white; border-color: var(--green); }
  .panel { display: none; }
  .panel.active { display: block; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-bottom: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; box-shadow: 0 2px 6px rgba(0,0,0,.05);
  }
  .card .val { font-size: 21px; font-weight: 700; }
  .card .lbl { font-size: 11.5px; color: #6b7280; margin-top: 2px; }
  .toolbar {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .toolbar input[type=text] {
    flex: 1 1 200px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px;
  }
  .status-filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .status-filters button {
    border: 1px solid var(--border); background: #fff; border-radius: 16px; padding: 5px 11px;
    font-size: 12.5px; cursor: pointer; color: #374151;
  }
  .status-filters button.active { color: white; border-color: transparent; background: var(--gray); }
  .btn-copyall {
    background: var(--green-light); color: white; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .btn-copyall:hover { background: var(--green); }
  table.data { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
  table.data thead th {
    background: #eef2f7; text-align: left; padding: 9px 10px; font-size: 12px; color: #1f3a5f;
    cursor: pointer; user-select: none; white-space: nowrap; border-bottom: 1px solid var(--border);
  }
  table.data thead th:hover { background: #e3e9f1; }
  table.data tbody td { padding: 8px 10px; font-size: 13px; border-bottom: 1px solid #eef1f4; white-space: nowrap; }
  table.data tbody tr:nth-child(even) { background: #fafcfe; }
  .badge { padding: 2px 8px; border-radius: 12px; font-size: 11.5px; font-weight: 600; color: white; }
  .copy-btn {
    border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 3px 8px;
    font-size: 11.5px; cursor: pointer; color: #374151;
  }
  .copy-btn.copied { background: var(--green-light); color: white; border-color: var(--green-light); }
  .table-wrap { overflow-x: auto; border-radius: 10px; }
  .pagination { display: flex; align-items: center; gap: 8px; justify-content: center; padding: 12px 0; font-size: 13px; }
  .pagination button {
    border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  .pagination button:disabled { opacity: .4; cursor: default; }
  .empty { padding: 30px; text-align: center; color: #6b7280; font-size: 13.5px; }
  footer { text-align: center; font-size: 11.5px; color: #9aa4b2; padding: 18px 0 30px; }
  @media (max-width: 640px) {
    table.data thead th, table.data tbody td { font-size: 12px; padding: 7px 7px; }
  }
</style>

<script>
const REPORT = JSON.parse(document.getElementById('report-data').textContent);
const STATUS_COLORS = {"Pass": "#1e8e5a", "Fail": "#c0392b", "Trong hạn": "#2a6ebb", "Trễ quá hạn": "#d9822b", "Không rõ": "#6b7280"};
const STATUS_ORDER = ["Tất cả", "Fail", "Trễ quá hạn", "Trong hạn", "Pass", "Không rõ"];
const PAGE_SIZE = 50;

const state = {}; // per customer code: { status: 'Tất cả', search: '', sortKey: null, sortDir: 1, page: 1 }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function fmtNum(n) { return (n ?? 0).toLocaleString('vi-VN'); }

function buildTabs() {
  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('panels');
  REPORT.customers.forEach((cust, idx) => {
    state[cust.code] = { status: 'Tất cả', search: '', sortKey: null, sortDir: 1, page: 1 };
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
    btn.textContent = `${cust.short} (${fmtNum(cust.total)})`;
    btn.onclick = () => switchTab(cust.code);
    btn.id = 'tabbtn-' + cust.code;
    tabsEl.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'panel' + (idx === 0 ? ' active' : '');
    panel.id = 'panel-' + cust.code;
    panel.innerHTML = buildPanelHtml(cust);
    panelsEl.appendChild(panel);
  });
  REPORT.customers.forEach(cust => {
    attachPanelEvents(cust);
    renderTable(cust);
  });
}

function switchTab(code) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tabbtn-' + code).classList.add('active');
  document.getElementById('panel-' + code).classList.add('active');
}

function buildPanelHtml(cust) {
  const rate = cust.pass_rate != null ? cust.pass_rate.toFixed(1) + '%' : 'N/A';
  const statusBtns = STATUS_ORDER.map(s => {
    const count = s === 'Tất cả' ? cust.total : (cust.status_counts[s] || 0);
    return `<button data-status="${escapeHtml(s)}" class="status-filter-btn${s==='Tất cả'?' active':''}" style="${s!=='Tất cả' && STATUS_COLORS[s] ? 'border-color:'+STATUS_COLORS[s] : ''}">${escapeHtml(s)} (${fmtNum(count)})</button>`;
  }).join('');

  return `
    <div class="cards">
      <div class="card"><div class="val">${fmtNum(cust.total)}</div><div class="lbl">Tổng vận đơn</div></div>
      <div class="card"><div class="val" style="color:${STATUS_COLORS['Pass']}">${rate}</div><div class="lbl">Tỷ lệ đạt</div></div>
      <div class="card"><div class="val" style="color:${STATUS_COLORS['Pass']}">${fmtNum(cust.status_counts['Pass'])}</div><div class="lbl">Pass</div></div>
      <div class="card"><div class="val" style="color:${STATUS_COLORS['Fail']}">${fmtNum(cust.status_counts['Fail'])}</div><div class="lbl">Fail</div></div>
      <div class="card"><div class="val" style="color:${STATUS_COLORS['Trễ quá hạn']}">${fmtNum(cust.status_counts['Trễ quá hạn'])}</div><div class="lbl">Trễ quá hạn</div></div>
    </div>
    <div class="toolbar">
      <input type="text" placeholder="Tìm số vận đơn..." class="search-input" data-code="${cust.code}">
      <div class="status-filters" data-code="${cust.code}">${statusBtns}</div>
      <button class="btn-copyall" data-code="${cust.code}">📋 Copy DS đang lọc</button>
    </div>
    <div class="table-wrap">
      <table class="data">
        <thead><tr>
          <th data-key="so_van_don">Số Vận Đơn</th>
          <th data-key="tinh">Tỉnh đến</th>
          <th data-key="ngay_gui">Ngày gửi</th>
          <th data-key="ngay_cam_ket">Ngày cam kết</th>
          <th data-key="ngay_tra">Ngày trả</th>
          <th data-key="so_ngay_tre">Số ngày trễ</th>
          <th data-key="trang_thai">Trạng thái</th>
          <th></th>
        </tr></thead>
        <tbody id="tbody-${cust.code}"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination-${cust.code}"></div>
  `;
}

function getFiltered(cust) {
  const st = state[cust.code];
  let rows = cust.rows;
  if (st.status !== 'Tất cả') rows = rows.filter(r => r.trang_thai === st.status);
  if (st.search) {
    const q = st.search.toLowerCase();
    rows = rows.filter(r => r.so_van_don.toLowerCase().includes(q));
  }
  if (st.sortKey) {
    rows = rows.slice().sort((a, b) => {
      let va = a[st.sortKey], vb = b[st.sortKey];
      if (va == null) va = '';
      if (vb == null) vb = '';
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * st.sortDir;
      return String(va).localeCompare(String(vb), 'vi') * st.sortDir;
    });
  }
  return rows;
}

function renderTable(cust) {
  const st = state[cust.code];
  const filtered = getFiltered(cust);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (st.page > totalPages) st.page = totalPages;
  const startIdx = (st.page - 1) * PAGE_SIZE;
  const pageRows = filtered.slice(startIdx, startIdx + PAGE_SIZE);

  const tbody = document.getElementById('tbody-' + cust.code);
  if (pageRows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty">Không có vận đơn khớp bộ lọc</td></tr>`;
  } else {
    tbody.innerHTML = pageRows.map(r => {
      const color = STATUS_COLORS[r.trang_thai] || '#6b7280';
      return `<tr>
        <td>${escapeHtml(r.so_van_don)}</td>
        <td>${escapeHtml(r.tinh)}</td>
        <td>${escapeHtml(r.ngay_gui)}</td>
        <td>${escapeHtml(r.ngay_cam_ket)}</td>
        <td>${escapeHtml(r.ngay_tra)}</td>
        <td>${r.so_ngay_tre != null ? r.so_ngay_tre : ''}</td>
        <td><span class="badge" style="background:${color}">${escapeHtml(r.trang_thai)}</span></td>
        <td><button class="copy-btn" data-copy="${escapeHtml(r.so_van_don)}">Copy</button></td>
      </tr>`;
    }).join('');
    tbody.querySelectorAll('.copy-btn').forEach(btn => {
      btn.onclick = () => {
        navigator.clipboard.writeText(btn.dataset.copy).then(() => {
          btn.textContent = '✓ Đã copy';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1200);
        });
      };
    });
  }

  const pag = document.getElementById('pagination-' + cust.code);
  pag.innerHTML = `
    <button ${st.page<=1?'disabled':''} id="prev-${cust.code}">‹ Trước</button>
    <span>Trang ${st.page}/${totalPages} — ${fmtNum(filtered.length)} vận đơn</span>
    <button ${st.page>=totalPages?'disabled':''} id="next-${cust.code}">Sau ›</button>
  `;
  const prevBtn = document.getElementById('prev-' + cust.code);
  const nextBtn = document.getElementById('next-' + cust.code);
  if (prevBtn) prevBtn.onclick = () => { st.page--; renderTable(cust); };
  if (nextBtn) nextBtn.onclick = () => { st.page++; renderTable(cust); };
}

function attachPanelEvents(cust) {
  const panel = document.getElementById('panel-' + cust.code);
  const searchInput = panel.querySelector('.search-input');
  let debounceT;
  searchInput.addEventListener('input', e => {
    clearTimeout(debounceT);
    debounceT = setTimeout(() => {
      state[cust.code].search = e.target.value.trim();
      state[cust.code].page = 1;
      renderTable(cust);
    }, 180);
  });

  panel.querySelectorAll('.status-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      panel.querySelectorAll('.status-filter-btn').forEach(b => {
        b.classList.remove('active');
        b.style.background = '';
        b.style.color = '';
      });
      btn.classList.add('active');
      const c = STATUS_COLORS[btn.dataset.status];
      if (c) { btn.style.background = c; btn.style.color = '#fff'; }
      state[cust.code].status = btn.dataset.status;
      state[cust.code].page = 1;
      renderTable(cust);
    });
  });

  panel.querySelectorAll('th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      const st = state[cust.code];
      if (st.sortKey === key) st.sortDir *= -1; else { st.sortKey = key; st.sortDir = 1; }
      renderTable(cust);
    });
  });

  panel.querySelector('.btn-copyall').addEventListener('click', () => {
    const filtered = getFiltered(cust);
    const text = filtered.map(r => r.so_van_don).join('\n');
    navigator.clipboard.writeText(text).then(() => {
      const btn = panel.querySelector('.btn-copyall');
      const original = btn.textContent;
      btn.textContent = `✓ Đã copy ${filtered.length} mã`;
      setTimeout(() => { btn.textContent = original; }, 1500);
    });
  });
}

buildTabs();
</script>
</body>
</html>
